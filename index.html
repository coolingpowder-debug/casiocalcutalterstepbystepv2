<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casio fx-991 Mode Calculator Step-by-Step</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #3b3b3b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #fff;
        }
        .main-container {
            display: flex;
            gap: 20px;
            background: #202020;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 2px solid #444;
            width: 700px;
        }
        .calculator-panel {
            flex: 1;
        }
        .brand {
            color: #d4af37;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 2px;
            letter-spacing: 1px;
        }
        .model {
            color: #aaa;
            font-size: 11px;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #ff9800;
        }
        select, input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        .btn-calc {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-calc:hover {
            background: #388e3c;
        }
        .result-box {
            background: #c8d6af;
            color: #000;
            padding: 12px;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            text-align: right;
            font-family: 'Courier New', Courier, monospace;
        }
        /* แท็บแสดงวิธีทำด้านข้าง */
        .steps-sidebar {
            width: 320px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .steps-sidebar h3 {
            font-size: 14px;
            color: #d4af37;
            margin-top: 0;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }
        .steps-content {
            font-size: 13px;
            line-height: 1.6;
            color: #ddd;
            overflow-y: auto;
            max-height: 360px;
            white-space: pre-line;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- แผงควบคุมและเลือกโหมด -->
    <div class="calculator-panel">
        <div class="brand">CASIO</div>
        <div class="model">fx-991ES Plus - Multi-Mode Simulator</div>
        
        <div class="form-group">
            <label for="modeSelect">เลือกโหมดการคำนวณ:</label>คำนวณสถิติ
            <select id="modeSelect" onchange="switchMode()">
                <option value="1">โหมด 1: คำนวณฟังก์ชันตรีโกณมิติ (sin, cos, tan)</option>
                <option value="2">โหมด 2: คำนวณสมการกำลังสอง (ax² + bx + c = 0)</option>
                <option value="3">โหมด 3: คำนวณสถิติเบื้องต้น (ค่าเฉลี่ย, ผลรวม)</option>
            </select>
        </div>

        <!-- ฟอร์มรับค่าตามโหมด -->
        <div id="inputForm">
            <!-- จะถูกเปลี่ยนด้วย JavaScript ตามโหมดที่เลือก -->
        </div>

        <button class="btn-calc" onclick="calculateMode()">คำนวณและแสดงสเตป</button>

        <div id="mainResult" class="result-box">ผลลัพธ์: รอการคำนวณ</div>
    </div>

    <!-- แท็บแสดงวิธีทำและสเตปทีละขั้นตอน -->
    <div class="steps-sidebar">
        <h3>วิธีทำและลำดับขั้นตอน (Steps)</h3>
        <div id="stepsBox" class="steps-content">กรุณาเลือกโหมด กรอกข้อมูล แล้วกดปุ่มคำนวณเพื่อดูขั้นตอนทีละสเตปที่นี่...</div>
    </div>
</div>

<script>
    function switchMode() {
        let mode = document.getElementById('modeSelect').value;
        let formHTML = '';

        if (mode === '1') {
            formHTML = `
                <div class="form-group">
                    <label>เลือกฟังก์ชัน:</label>
                    <select id="trigFunc">
                        <option value="sin">sin (ไซน์)</option>
                        <option value="cos">cos (โคไซน์)</option>
                        <option value="tan">tan (แทนเจนต์)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ใส่ค่ามุม (หน่วยเป็นองศา):</label>
                    <input type="number" id="trigAngle" placeholder="เช่น 30, 45, 90" value="30">
                </div>
            `;
        } else if (mode === '2') {
            formHTML = `
                <div class="form-group"><label>ค่า a:</label><input type="number" id="quadA" value="1"></div>
                <div class="form-group"><label>ค่า b:</label><input type="number" id="quadB" value="-3"></div>
                <div class="form-group"><label>ค่า c:</label><input type="number" id="quadC" value="2"></div>
            `;
        } else if (mode === '3') {
            formHTML = `
                <div class="form-group">
                    <label>ใส่ชุดตัวเลข (คั่นด้วยเครื่องหมายจุลภาค ,):</label>
                    <input type="text" id="statData" placeholder="เช่น 10, 20, 30, 40, 50" value="10, 20, 30, 40, 50">
                </div>
            `;
        }

        document.getElementById('inputForm').innerHTML = formHTML;
        document.getElementById('stepsBox').innerText = 'เปลี่ยนโหมดเรียบร้อย กรุณากรอกข้อมูลและกดคำนวณ';
        document.getElementById('mainResult').innerText = 'ผลลัพธ์: รอการคำนวณ';
    }

    // โหลดหน้าแรกให้แสดงโหมด 1 ทันที
    window.onload = function() {
        switchMode();
    };

    function calculateMode() {
        let mode = document.getElementById('modeSelect').value;
        let steps = "";
        let finalRes = "";

        if (mode === '1') {
            let func = document.getElementById('trigFunc').value;
            let angle = parseFloat(document.getElementById('trigAngle').value);

            if (isNaN(angle)) {
                alert('กรุณากรอกตัวเลขมุมให้ถูกต้อง');
                return;
            }

            let rad = angle * (Math.PI / 180);
            let res = 0;
            let funcName = '';

            if (func === 'sin') { res = Math.sin(rad); funcName = 'sin'; }
            else if (func === 'cos') { res = Math.cos(rad); funcName = 'cos'; }
            else if (func === 'tan') { res = Math.tan(rad); funcName = 'tan'; }

            res = parseFloat(res.toFixed(6));

            steps = `=== โหมด 1: คำนวณฟังก์ชันตรีโกณมิติ ===\n\n`;
            steps += `1. กำหนดฟังก์ชัน: ${funcName}(${angle}°)\n`;
            steps += `2. แปลงมุมองศาเป็นเรเดียน:\n   Rad = ${angle} × (π / 180)\n   Rad = ${rad.toFixed(4)}\n`;
            steps += `3. คำนวณค่าทางคณิตศาสตร์:\n   = ${res}`;
            
            finalRes = res;

        } else if (mode === '2') {
            let a = parseFloat(document.getElementById('quadA').value);
            let b = parseFloat(document.getElementById('quadB').value);
            let c = parseFloat(document.getElementById('quadC').value);

            if (a === 0) {
                alert('ค่า a ต้องไม่เท่ากับ 0 สำหรับสมการกำลังสอง');
                return;
            }

            let discriminant = (b ** 2) - (4 * a * c);
            steps = `=== โหมด 2: คำนวณสมการกำลังสอง ===\n`;
            steps += `สมการ: ${a}x² + (${b})x + (${c}) = 0\n\n`;
            steps += `1. คำนวณค่า Discriminant (Δ):\n   Δ = b² - 4ac\n   Δ = (${b})² - 4(${a})(${c})\n   Δ = ${discriminant}\n\n`;

            if (discriminant > 0) {
                let x1 = (-b + Math.sqrt(discriminant)) / (2 * a);
                let x2 = (-b - Math.sqrt(discriminant)) / (2 * a);
                steps += `2. ค่า Δ > 0 มี 2 คำตอบจริง:\n   x1 = ${x1.toFixed(4)}\n   x2 = ${x2.toFixed(4)}`;
                finalRes = `x1 = ${x1.toFixed(2)}, x2 = ${x2.toFixed(2)}`;
            } else if (discriminant === 0) {
                let x = -b / (2 * a);
                steps += `2. ค่า Δ = 0 มี 1 คำตอบ:\n   x = ${x.toFixed(4)}`;
                finalRes = `x = ${x.toFixed(2)}`;
            } else {
                steps += `2. ค่า Δ < 0 ไม่มีคำตอบที่เป็นจำนวนจริง`;
                finalRes = `No Real Roots`;
            }

        } else if (mode === '3') {
            let rawData = document.getElementById('statData').value;
            let arr = rawData.split(',').map(item => parseFloat(item.trim())).filter(num => !isNaN(num));

            if (arr.length === 0) {
                alert('กรุณากรอกชุดข้อมูลตัวเลขให้ถูกต้อง');
                return;
            }

            let n = arr.length;
            let sum = arr.reduce((acc, val) => acc + val, 0);
            let mean = sum / n;

            steps = `=== โหมด 3: คำนวณสถิติเบื้องต้น ===\n`;
            steps += `ชุดข้อมูล: [${arr.join(', ')}]\n\n`;
            steps += `1. จำนวนข้อมูลทั้งหมด (n) = ${n}\n`;
            steps += `2. ผลรวมทั้งหมด (Σx) = ${sum}\n`;
            steps += `3. คำนวณค่าเฉลี่ย (Mean):\n   x̄ = Σx / n\n   x̄ = ${sum} / ${n}\n   x̄ = ${mean.toFixed(4)}`;

            finalRes = `Mean (x̄) = ${mean.toFixed(2)}`;
        }

        document.getElementById('mainResult').innerText = "ผลลัพธ์: " + finalRes;
        document.getElementById('stepsBox').innerText = steps;
    }
</script>

</body>
</html>
